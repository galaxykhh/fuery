name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # CI follows the latest stable Flutter and resolves dependencies fresh (no
  # lockfile is committed), so a new release can break main without a commit.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest stable
            version: ''
          # The oldest versions the pubspecs allow: Flutter 3.27 with Dart 3.6.
          - name: oldest supported
            version: '3.27.0'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      # publish.yml dry-runs every package before it uploads any, and a dry-run
      # fails on pub's warnings too, such as a checked-in file that `flutter
      # pub get` rewrote. Run them here, before the tests write anything, so a
      # pull request finds that instead of the release tag.
      - if: matrix.version == ''
        run: dart pub publish --dry-run
        working-directory: packages/fuery_core
      - if: matrix.version == ''
        run: flutter pub publish --dry-run
        working-directory: packages/fuery
      - if: matrix.version == ''
        run: flutter pub publish --dry-run
        working-directory: packages/fuery_hooks
      # The packages share one version and depend on each other at it. On a tag
      # push from publish.yml, the tag and the changelogs must match it too.
      - if: matrix.version == ''
        run: python3 tool/check_versions.py
      # Released packages keep printing their docs links, so a renamed page or
      # heading must not break one. It runs here because docs.yml runs only
      # when some paths change, and misses READMEs and fuery_hooks.
      - if: matrix.version == ''
        run: python3 tool/check_doc_links.py
      # Formatting can differ between Dart versions; check it on the latest.
      - if: matrix.version == ''
        run: dart format --output=none --set-exit-if-changed packages
      - run: flutter analyze packages
      # `dart fix` rewrites deprecated names with fuery_core's lib/fix_data.yaml.
      # The test_fixes/ of each package whose barrel exports a renamed name
      # holds a golden case for it; fuery_hooks hides FocusManager.
      - run: |
          for p in fuery_core fuery; do
            (cd packages/$p/test_fixes && dart fix --compare-to-golden) || exit 1
          done
      # On the latest version the core tests also write coverage/lcov.info.
      - if: matrix.version != ''
        run: dart test
        working-directory: packages/fuery_core
      - if: matrix.version == ''
        run: |
          dart pub global activate coverage
          dart pub global run coverage:test_with_coverage
        working-directory: packages/fuery_core
      - run: flutter test --coverage
        working-directory: packages/fuery
      - run: flutter test
        working-directory: packages/fuery/example
      - run: flutter test --coverage
        working-directory: packages/fuery_hooks
      # Every package stays at 100% line coverage.
      - if: matrix.version == ''
        run: python3 tool/check_coverage.py packages/fuery_core packages/fuery packages/fuery_hooks
      # The report lists which of the public API the docs mention. Regenerate
      # it with `python3 docs/tool/api_coverage.py` when the API changes.
      - if: matrix.version == ''
        run: |
          python3 docs/tool/api_coverage.py
          git diff --exit-code docs/api-coverage.md
