name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages
      - run: flutter analyze packages
      - run: dart test
        working-directory: packages/fuery_core
      - run: flutter test
        working-directory: packages/fuery
      - run: flutter test
        working-directory: packages/fuery/example
