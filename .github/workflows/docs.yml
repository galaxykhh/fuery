name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - packages/fuery/playground/**
      - packages/fuery/lib/**
      - packages/fuery_core/lib/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - packages/fuery/playground/**
      - packages/fuery/lib/**
      - packages/fuery_core/lib/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The playground runs at /fuery/demo/. It turns the devtools on itself.
      - name: Build the playground
        run: flutter build web --release --base-href /fuery/demo/
        working-directory: packages/fuery/playground
      # Astro copies public/ into the site as it is.
      - run: cp -r packages/fuery/playground/build/web docs/public/demo
      # The playground draws on a canvas, so search engines find no text on
      # it. grep fails the build if the tag didn't go in.
      - name: Keep the playground out of search results
        run: |
          sed -i 's|<head>|<head><meta name="robots" content="noindex">|' docs/public/demo/index.html
          grep -q '<meta name="robots" content="noindex">' docs/public/demo/index.html
      - uses: withastro/action@v6
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
