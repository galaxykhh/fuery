name: Publish

# Push a tag like v0.3.0 to publish the packages and create a GitHub release
# from their CHANGELOG entries. CI checks first that the versions match the
# tag and that every CHANGELOG has an entry for it (tool/check_versions.py).
# Each package on pub.dev must allow automated publishing from this repository
# with the tag pattern v{{version}}.
#
# A failed run can be re-run: it skips a package whose version is already on
# pub.dev, and publishes the rest at the same version.
#
# pub.dev allows automated publishing only for a package that exists, so a new
# package's first version is published by hand from a checkout of its tag, not
# from main:
#
#   git worktree add ../fuery-vX.Y.Z vX.Y.Z
#   (cd ../fuery-vX.Y.Z && flutter pub get)
#   (cd ../fuery-vX.Y.Z/packages/<package> && flutter pub publish)
#   git worktree remove ../fuery-vX.Y.Z
#
# The package gets a publish step here once it's on pub.dev.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pub.dev authenticates this workflow with an OIDC token
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Validate every package before uploading any, so a package pub.dev
      # would reject doesn't leave the others published without it.
      - run: dart pub publish --dry-run
        working-directory: packages/fuery_core
      - run: flutter pub publish --dry-run
        working-directory: packages/fuery
      - run: flutter pub publish --dry-run
        working-directory: packages/fuery_hooks
      # fuery depends on fuery_core, so publish the core first. A re-run skips
      # a version that is already on pub.dev.
      - name: Publish fuery_core
        run: |
          if curl -sfo /dev/null "https://pub.dev/api/packages/fuery_core/versions/${GITHUB_REF_NAME#v}"; then
            echo "fuery_core ${GITHUB_REF_NAME#v} is already on pub.dev."
          else
            dart pub publish --force
          fi
        working-directory: packages/fuery_core
      - name: Publish fuery
        run: |
          if curl -sfo /dev/null "https://pub.dev/api/packages/fuery/versions/${GITHUB_REF_NAME#v}"; then
            echo "fuery ${GITHUB_REF_NAME#v} is already on pub.dev."
          else
            flutter pub publish --force
          fi
        working-directory: packages/fuery

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag is needed for the compare link
      # Builds the notes from the "## X.Y.Z" entries of both changelogs.
      - name: Write release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v heading="## $version" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found && NF { print }
            ' "$1"
          }
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## fuery"
            section packages/fuery/CHANGELOG.md
            echo
            echo "## fuery_core"
            section packages/fuery_core/CHANGELOG.md
            echo
            echo "## fuery_hooks"
            section packages/fuery_hooks/CHANGELOG.md
            echo
            echo "**pub.dev:** [fuery $version](https://pub.dev/packages/fuery/versions/$version) · [fuery_core $version](https://pub.dev/packages/fuery_core/versions/$version) · [fuery_hooks $version](https://pub.dev/packages/fuery_hooks/versions/$version)"
            echo "**Docs:** https://galaxykhh.github.io/fuery/"
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
