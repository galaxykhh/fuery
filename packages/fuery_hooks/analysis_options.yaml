include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

analyzer:
  # `flutter pub get` on the latest Flutter adds any of these that are
  # missing, which would leave this checked-in file modified and fail
  # `pub publish --dry-run`.
  exclude:
    - build/**
    # The fix tests use deprecated names on purpose; `dart fix
    # --compare-to-golden` checks them from inside test_fixes/.
    - test_fixes/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
