name: fuery_hooks
description: "Hooks for Fuery: useQuery, useInfiniteQuery, useMutation, useQueries, and useMutationState for flutter_hooks, with useOnQueryChange and useOnMutationChange for side effects."
version: 1.5.0
homepage: https://galaxykhh.github.io/fuery/guides/hooks/
repository: https://github.com/galaxykhh/fuery/tree/main/packages/fuery_hooks
documentation: https://galaxykhh.github.io/fuery/guides/hooks/
topics:
  - hooks
  - server-state
  - cache
  - state-management
  - offline

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.2
  fuery: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
