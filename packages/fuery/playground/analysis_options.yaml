include: package:flutter_lints/flutter.yaml

analyzer:
  # `flutter pub get` on the latest Flutter adds any of these that are
  # missing, which would leave this checked-in file modified and fail
  # `pub publish --dry-run`.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
